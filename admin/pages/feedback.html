<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Обратная связь — Админ</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../css/layout-v2.css" />
</head>
<body>

  <nav class="nav"></nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <p class="admin-sidebar__label">Навигация</p>
      <nav class="admin-nav">
        <a href="dashboard.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="places.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Места
        </a>
        <a href="places-export.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span data-i18n="admin.nav.exportPlaces">Экспорт мест</span>
        </a>
        <a href="places-import.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span data-i18n="admin.nav.importPlaces">Импорт мест</span>
        </a>
        <a href="home.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Главная
        </a>
        <a href="pages.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Страницы
        </a>
        <a href="media.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Медиа
        </a>
        <a href="feedback.html" class="active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Обратная связь
        </a>
        <a href="reviews.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Отзывы о местах
        </a>
        <a href="users.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Пользователи
        </a>
      </nav>
      <div class="sidebar-bottom">
        <button class="btn btn--outline btn--sm btn--full" id="logout-btn">Выйти</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <p class="admin-breadcrumb">Админка / Обратная связь</p>
      </div>
      <div class="admin-main__header">
        <h1 class="admin-main__title" data-i18n="admin.feedback.title">Обратная связь</h1>
      </div>

      <div class="stats-bar" id="stats-bar">
        <div class="stat">
          <div class="stat__value" id="stat-total">—</div>
          <div class="stat__label" data-i18n="admin.feedback.total">Всего</div>
        </div>
        <div class="stat">
          <div class="stat__value" id="stat-avg">—</div>
          <div class="stat__label" data-i18n="admin.feedback.avgRating">Средняя оценка</div>
        </div>
      </div>

      <div class="filter-row" id="filter-row">
        <button class="filter-btn active" data-rating="0" data-i18n="admin.feedback.filterAll">Все</button>
        <button class="filter-btn" data-rating="5">★★★★★</button>
        <button class="filter-btn" data-rating="4">★★★★</button>
        <button class="filter-btn" data-rating="3">★★★</button>
        <button class="filter-btn" data-rating="2">★★</button>
        <button class="filter-btn" data-rating="1">★</button>
      </div>

      <div class="feedback-list" id="feedback-list"></div>
      <div class="state-empty hidden" id="empty-state">
        <h3 data-i18n="admin.feedback.emptyTitle">Отзывов пока нет</h3>
        <p data-i18n="admin.feedback.emptyText">Они появятся здесь, когда пользователи начнут оставлять отзывы.</p>
      </div>
    </main>
  </div>

  <style>
    .admin-modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .admin-modal.is-open { display: flex; }
    .admin-modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      animation: adminModalFade .14s ease;
    }
    .admin-modal__panel {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: var(--c-surface);
      border: 1px solid var(--c-border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 18px 18px 16px;
      animation: adminModalPop .14s ease;
    }
    .admin-modal__title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .admin-modal__body {
      color: var(--c-text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0 0 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .admin-modal__actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    @keyframes adminModalFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes adminModalPop {
      from { transform: translateY(6px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
  </style>

  <div class="admin-modal" id="delete-modal" aria-hidden="true">
    <div class="admin-modal__backdrop" data-modal-close></div>
    <div class="admin-modal__panel" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h2 class="admin-modal__title" id="delete-modal-title">Удалить сообщение?</h2>
      <p class="admin-modal__body" id="delete-modal-body"></p>
      <div class="admin-modal__actions">
        <button class="btn btn--outline btn--sm" id="delete-modal-cancel" data-modal-close>Отмена</button>
        <button class="btn btn--primary btn--sm" id="delete-modal-confirm">Удалить</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="../js/shared/admin-shell.js"></script>
  <script type="module" src="../js/pages/feedback.js"></script>
</body>
</html>
